[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "propertylm-uk"
version = "0.2.0"
description = "UK EPC/UPRN address embeddings with hierarchical Qdrant retrieval and reranking"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "duckdb>=1.1,<2",
  "polars>=1.20,<2",
  "pyarrow>=17,<22",
  "numpy>=1.26,<3",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "typer>=0.12,<1",
  "rich>=13,<15",
  "sentence-transformers>=3.2,<6",
  "torch>=2.2,<3",
  "qdrant-client>=1.12,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.7"]
# Paper reproduction: baselines, sensitivity sweep, and figures (scripts/).
paper = ["pandas>=2,<3", "rapidfuzz>=3,<4", "matplotlib>=3.8,<4"]

[project.scripts]
propertylm = "propertylm.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["propertylm"]
